# Builds the Windows installer .exe.
#
# PyInstaller cannot cross-compile, and this project is developed on Linux, so the
# binary is built on a real windows-latest runner rather than under wine. `mods/`
# and bsfshader.dll are bundled into the exe and unpacked to sys._MEIPASS at run
# time; tools/install.py reads both from there.
#
# Two jobs, because the two artefacts want opposite toolchains: the DLL is an
# i686 mingw cross-build (Linux), the installer is PyInstaller (Windows). The
# first feeds the second through an artifact.
#
# Security notes, since this workflow is deliberately locked down:
#   * `permissions` is read-only by default and raised to `contents: write` only in
#     the release job, which runs only for a tag.
#   * The release upload uses the built-in GITHUB_TOKEN via `gh` rather than a
#     third-party action, so no external action can see the token.
#   * Build dependencies are hash-pinned in .github/requirements-windows.txt and
#     installed with --require-hashes, so the pip side is pinned as tightly as the
#     actions side.
#   * Every action is pinned to a full commit SHA, not a tag. A tag like `v4` is a
#     MUTABLE pointer that its maintainers move as they release; a compromised
#     action repo can retarget it and your next run executes attacker code with the
#     release job's contents:write token. That is how the tj-actions/changed-files
#     compromise leaked secrets in March 2025. A SHA cannot be moved. The trailing
#     comment records which release each SHA was, so Dependabot can bump both.
name: build-installer

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # bsfshader.dll is built here rather than in the Windows job because it is an
  # i686 mingw target and build.sh is the single answer to how it is built --
  # duplicating those flags in PowerShell is how the two copies drift. It is a
  # 32-bit DLL because the game is a 32-bit GM7 runner; a windows-latest MSVC
  # build would default to x64 and load into nothing.
  #
  # It must be bundled: mods/shader.gml is a file of `external_define`s, so
  # without the DLL that file aborts and install.py writes mods/shader.off. A
  # source clone runs build.sh and has it; before this job, anyone installing
  # from the released exe did not, which made every shader effect source-only.
  #
  # bsfnat.dll is deliberately NOT bundled. build.sh produces it in the same
  # step, but it is the cursor cache -- a wine-specific optimisation that buys
  # ~nothing on Windows, which is exactly what install.py prints when it finds
  # no DLL. Shipping it would add weight to a Windows exe for no gain.
  shader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Install i686 mingw
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686

      - name: Build bsfshader.dll
        run: tools/build.sh

      # Assert what was actually produced. A wrong-architecture DLL still builds
      # and still uploads; it fails at external_define on a player's machine,
      # which is the silent failure this whole job exists to prevent.
      - name: Check it is a 32-bit PE
        run: |
          file tools/bsfshader.dll
          file tools/bsfshader.dll | grep -q 'PE32 executable' \
            || { echo 'bsfshader.dll is not a PE32 (32-bit) DLL'; exit 1; }
          file tools/bsfshader.dll | grep -q 'PE32+' \
            && { echo 'bsfshader.dll is 64-bit; the game is 32-bit'; exit 1; }
          exit 0

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: bsfshader-dll
          path: tools/bsfshader.dll
          if-no-files-found: error

  build:
    needs: shader
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: bsfshader-dll
          path: .

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      # --require-hashes: every package must be pinned by version AND sha256, so a
      # compromised PyPI release of the exact pinned version cannot get in either.
      # Adding a dependency without a hash fails the build rather than quietly
      # widening what this workflow trusts.
      - name: Install PyInstaller
        run: pip install --require-hashes -r .github/requirements-windows.txt

      # --add-data, not --add-binary, for bsfshader.dll and the vendored
      # d3d8to9: --add-binary runs PyInstaller's dependency analysis over the
      # file, and these are 32-bit DLLs being inspected by a 64-bit Python on a
      # Windows runner. Nothing needs that analysis -- both are loaded by the
      # game at run time, never imported by the installer -- and --add-data is a
      # verbatim copy, which is all that is wanted.
      #
      # --paths and --hidden-import are both needed: install.py imports patch_bsf
      # after mutating sys.path at run time, which PyInstaller's static analysis
      # cannot follow, so the modules must be named explicitly or the exe builds
      # fine and fails on first launch with ModuleNotFoundError.
      - name: Build
        run: >
          pyinstaller --onefile --console
          --name BSF-Legacy-Installer
          --add-data "mods;mods"
          --add-data "vendor/d3d8to9;vendor/d3d8to9"
          --add-data "bsfshader.dll;."
          --paths tools
          --hidden-import patch_bsf
          --hidden-import hwvp
          --hidden-import dplay
          --hidden-import cursorfix
          --hidden-import gm7
          tools/install.py

      # Smoke test: the exe must start, find no game, say so, and exit 1 -- that
      # nonzero exit is the CONTRACT for the not-found path, so it is asserted
      # rather than suppressed. Catches a missing hidden import, which is
      # otherwise invisible until a user runs it.
      #
      # The explicit `exit 0` at the end is load-bearing: the Actions runner
      # appends `exit $LASTEXITCODE` to every pwsh step, so without it the step
      # inherits the installer's expected exit 1 and fails after all checks pass.
      - name: Smoke test
        run: |
          $out = & ".\dist\BSF-Legacy-Installer.exe" 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($out -notmatch 'Could not find BattleshipsForever.exe') {
            Write-Error "installer did not produce the expected not-found message"
            exit 1
          }
          if ($code -ne 1) {
            Write-Error "expected exit code 1 for the not-found path, got $code"
            exit 1
          }
          exit 0

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: BSF-Legacy-Installer
          path: dist/BSF-Legacy-Installer.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: BSF-Legacy-Installer
          path: dist
      # Pushing a v* tag publishes. There is no draft state to review the exe in
      # any more, so tag only what the gates have already passed -- the tag push
      # IS the public act.
      #
      # The exe is passed to `create` rather than uploaded in a second step, so
      # the release is never briefly public with no download on it. `upload
      # --clobber` then covers the re-run case, where `create` fails because the
      # release already exists and `|| true` swallows that.
      #
      # --generate-notes appends GitHub's own notes below the --notes line (gh
      # prepends --notes to generated ones), and --title keeps the release named
      # after the tag rather than letting generation pick a title.
      #
      # KNOWN LIMIT: generated notes itemise merged PULL REQUESTS. This repo
      # pushes straight to main and has never had a PR, so what lands is the
      # "Full Changelog" compare link, not a per-commit list. The prose changelog
      # lives in the annotated tag message; `--notes-from-tag` would publish that
      # instead, but it cannot be combined with --notes and needs the release
      # job's checkout to fetch tags (fetch-depth: 0), which it currently does
      # not.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/BSF-Legacy-Installer.exe \
            --title "${GITHUB_REF_NAME}" \
            --notes "Windows installer. Requires your own copy of Battleships Forever v0.90d." \
            --generate-notes \
            || true
          gh release upload "${GITHUB_REF_NAME}" dist/BSF-Legacy-Installer.exe --clobber
