# Act II — Episode 9: Bolthole
# Beat script for campaign/build.py. Source narrative: campaign/ACT-II.md (V1).
#
# Text rules: '#' is a line break (the game's own convention), apostrophes are
# fine (they compile to plain double-quoted globals), double quotes and em
# dashes are not (font + quoting) — the linter enforces this.

id: a2m1
episode: 9
mission: 8            # global.mission value this episode answers to
title: Bolthole
subtitle: Act II - Episode 9

room:
  width: 5600
  height: 2000
  caption: Bolthole

player:
  object: Hestia
  x: 260
  y: 1000
  damage: 0.55        # section HP multiplier at spawn — the ship arrives hurt

fail:
  ship: "Your ship was destroyed!# #The critical supplies were lost."

scenery:
  nebula: 16          # ter_Nebula scattered over the room at create

# The storm — a painted field, not a list of circles. One cell is 50 world
# units; '#' costs a section `dmg` HP per step, '@' costs `hot`, '.' is clear
# space. The gas clouds are scattered over these same cells, but a cloud is
# many cells wide — gas laps over clear space, and only the mask bites.
# Paint it in tools/editor.
storm:
  cell: 50
  dmg: 0.3
  hot: 0.4
  density: 0.18       # gas-cloud puffs per filled cell
  lightning: 90       # average frames between strikes (0 = none)
  mask:
    - "...........................................#..@@@@@@@@@@@@@@@@@##......#@@@@@......############@@@@@@..........."
    - "........#.........#....................###.###@@@@@@@@@@@@@@@@@###.....##@@@........#############@@@@@######...."
    - "##.################...................#####..##@@@@@@@@@@@@@@@####.....#####.........###.#######.@@@@@#######..."
    - "#....#@@@.....##.........####........@#####..########################...###...............#####..@@@@@########.."
    - "#....#@@@@@@.#.....@@@###...##.......@#####...###############.########............................@@@#########.."
    - "#.....@@@@@@@......@@@#......#####...@@###.......................#####............................#######@@@###."
    - "#...####.@@@@......@@@...........................................#####............................######@@@@@##."
    - "#####...##@@@......##.............#...............................###.............................######@@@@@###"
    - "............@@@...##..............#...............................................................######@@@@@###"
    - "...........#@@@..##.#.............#.#..............................................................#####@@@@@###"
    - ".........#.#@@@.##.##...............#...............................................................####@@@@@###"
    - ".........###...##.##...............##.................................................................##@@@@@###"
    - "...............#.#.................##..................................................................##@@@####"
    - "...............#...................##...................................................................########"
    - ".............@@@@...................#....................................................................#######"
    - ".............@@@@........................................................................................#######"
    - ".............@@@@........................................................................................#######"
    - "..............#..........................................................................................#######"
    - ".............#...........................................................................................#######"
    - ".............#...........................................................................................#######"
    - ".............#...........................................................................................#@@@###"
    - ".........................................................................................................@@@@@##"
    - ".............................................#...........................................................@@@@@##"
    - "............................#............................................................................@@@@@##"
    - "...........................##...............#...........................................................#@@@@@##"
    - "...........................##...............#...........................................................#@@@@@##"
    - "...........................#.................#..........................................................@@@@@@##"
    - "...........................#...........................................................................#@@@@@###"
    - "..........................#................#.#.........................................................#@@@@@###"
    - ".........................###.................#........................................................##@@@@@###"
    - ".#.......................####........................................................................##@@@@@@###"
    - ".##......................#####......................................................................###@@@@@####"
    - ".##......................#...##............#.......................................................###@@@@@@####"
    - "..#......................#####@@@.................................................................####@@@@@@@##."
    - "..#@@@.....................##.@@@..............##############.@@@..........@@@...................#####@@@@@@@##."
    - "..#@@@........................@@@..............@@@@@@@@@@@@@@@@@@@........@@@@@.........@@@####..####@@@@@@@@##."
    - "..@@@@.........................##.............#@@@@@@@@@@@@@@@@@@@@.......@@@@@........@@@@@####.###@@@@@@@@##.."
    - "..@@@@#........##...#...........#.......#######@@@@@@@@@@@@@@@@@@@@.......@@@@@........@@@@@########@@@@@####..."
    - "..@@@@.........####..............#..#####.......@@@@@@@@@@@@@@@@@@@...#####@@@####.....@@@@@########@@@@@##....."
    - "..................................###........................@@@@@...##############.....@@@##########@@@##......"

# The Ratlines — dead beacons flown in order (MoveToArea gates).
gates:
  - {x: 724, y: 1448}
  - {x: 1314, y: 739}
  - {x: 1911, y: 1222}
  - {x: 2269, y: 741}
  - {x: 3120, y: 1120}

meteors:
  interval: 35        # frames between spawn attempts while on
  cap: 48             # max live obs_Meteor — this is the density
  from: top           # edge they enter by: right | top | bottom | left
  spread: 60          # degrees of fan about straight across
  speed: {min: 1, max: 2.2}
  region: {x1: 0, x2: 3430} # rocks are only ever placed inside this

# How far the camera may look. Bolthole sits behind this line for the whole run
# and is pre-spawned behind it, so the arrival is a camera move rather than six
# hulls appearing out of nothing. 3600 is 170 past the gate batteries -- their
# guns are fully visible with a sliver of space beyond -- and 90 short of the
# leftmost berth's art. The minimap is blacked out past the same line, which is
# also what keeps a camera that stops reading as a door rather than a bug.
bounds: {x2: 3600}

# The storm wall that closes the Ratline behind you, lit at the surge beat.
# It is real storm: it fills the mask as it advances, so it damages through the
# same path as the painted field, at `dmg` instead of 0.3 -- a few seconds
# inside it, not a slow bleed.
#
# `speed` is a floor and never a rate: the front never slows, so a ship that
# stops is always caught and the wall is never seen waiting for you. Past
# `slack` it closes at `rush` times speed until the gap is back to `gap`, which
# is the whole of what keeps it in frame for a fast player.
#
# It parks at 2900, and that number is not about the guns -- it is about the
# cutscene. Reaching beacon five fires a dialogue sequence the player cannot fly
# out of, so the wall has to stop before the ship is pinned there. The gate
# fires within 100 units of the beacon (3120), so the earliest the scene can
# start is x 3020 and a hull sitting there reaches back to about 2945. 2900
# leaves the wall visibly at your heels through the whole exchange and unable to
# touch you during it.
surge:
  back: 900           # lights this far behind the ship
  speed: 1.2          # units/step, never slower
  gap: 500            # the gap it tries to hold
  slack: 800          # past this it accelerates
  rush: 2.2           # by this much
  stop: 2900          # parks here, short of the LAST BEACON
  dmg: 2.5            # per section per step inside it
  shield: 88          # radius — a close fit on a hull 151 across

beats:
  - note:
      - "The dead beacons themselves, one per gate. They are placed *on* the"
      - "gate coordinate rather than beside it: MoveToArea fires at 100 units"
      - "and the hull is 151 across, so the gate clears about 25 units short of"
      - "the outermost spar tip and the player never has to touch one."
      - ""
      - "These are ordinary spawns, so moving a beacon in gates: does NOT move"
      - "the hull sitting on it -- both coordinates have to change together."
      - ""
      - "team: ally, so the hulls are not the player's to select and fly away."
      - "It is not what colours them: every section carries a fixed colour"
      - "(l_colourmod -1, which survives export as nSec2a's eleventh field), so"
      - "a beacon looks the same whatever team it spawns into. That is the"
      - "point -- a Ratline beacon belongs to nobody, and reading as ally-cyan"
      - "would say the opposite. What the team does still reach is the minimap"
      - "blip, which is how you see them from across the lane."
      - ""
      - "Two of the five are the hulk variant, so the run does not look stamped"
      - "out; facing varies for the same reason, though the hull is four-fold"
      - "symmetric so only facing mod 90 shows."
      - ""
      - "All five sit in clear storm cells with two cells of margin. The storm"
      - "runs its damage as `with (ShipSection)` and does not care whose, so"
      - "that margin is what keeps the field from eating them."
      - ""
      - "The two gate batteries are here rather than in the challenge beat"
      - "because they are emplacements, not an event: popping them into"
      - "existence on the hail would be wrong, and the player can see that"
      - "stretch of lane well before reaching it. What the hail supplies is the"
      - "reading -- 'authenticate or be fired upon' lands differently once the"
      - "guns saying it are already on screen."
      - ""
      - "They sit at x 3430, between beacon five (3120) and the yard's left"
      - "edge (3709). The y pair is not eyeballed: the line from beacon five"
      - "to the gate_at crosses x 3430 at y 1039, so 800 and 1290 centre the"
      - "gap on the course the player actually flies, to within 6 units. Each"
      - "hull is 180 x 168, leaving 322 clear to thread. Facing is the whole"
      - "of what makes them a *pair*: the design points its guns +x, and 205"
      - "and 155 turn them down-lane and inward, so their arcs cross over the"
      - "gap rather than pointing the same way twice."
    start: true
    controls: off
    music: stop
    eerie: on
    interference: on
    camera: {x: 260, y: 1000, speed: 0}
    spawn:
      - {ship: "mods/ships/beacon_ratline.shp", team: ally, hold: true, facing: 12, x: 724, y: 1448}
      - {ship: "mods/ships/beacon_ratline_hulk.shp", team: ally, hold: true, facing: 61, x: 1314, y: 739}
      - {ship: "mods/ships/beacon_ratline.shp", team: ally, hold: true, facing: 34, x: 1911, y: 1222}
      - {ship: "mods/ships/beacon_ratline_hulk.shp", team: ally, hold: true, facing: 78, x: 2269, y: 741}
      - {ship: "mods/ships/beacon_ratline.shp", team: ally, hold: true, facing: 23, x: 3120, y: 1120}
      - {ship: "mods/ships/station_gatebattery.shp", team: ally, hold: true, facing: 205, x: 3430, y: 800, name: gateN}
      - {ship: "mods/ships/station_gatebattery.shp", team: ally, hold: true, facing: 155, x: 3430, y: 1290, name: gateS}
      - {ship: "mods/ships/station_bolthole.shp", team: ally, hold: true, facing: 90, x: 4269, y: 1102, name: station}
      - {object: ter_Planet, x: 3955, y: 461}
      - {object: Hecate, hold: true, facing: 270, x: 3790, y: 707, name: berth1}
      - {object: Cronus, hold: true, facing: 270, x: 3989, y: 775, name: berth2}
      - {object: Athena, hold: true, facing: 270, x: 4560, y: 707, name: berth3}
      - {object: Hestia, hold: true, facing: 270, x: 4737, y: 800, name: berth4}
    say:
      who: "[Hint]"
      sprite: spr_MesHint
      text: "Navigation computer restored. With your ship selected, right-click on any point in space to issue a move order."

  - say:
      who: Helm
      sprite: spr_MesMan1
      text: "Captain, the Coalsack storm wall is dead ahead. Ratline beacons are dark again - we'll have to thread the lanes by eye."

  - say:
      who: "[Hint]"
      sprite: spr_MesHint
      text: "Storm cells are red clouds. They will damage any section inside them. Rogue asteroids drift through the lanes - evade them or destroy them."

  - note:
      - "The helm comes back here too. The three opening beats set the scene --"
      - "the nav computer, Helm on the storm wall, the hint about cells and"
      - "rocks -- and none of them are worth reading while the player is already"
      - "flying away from them. controls: off in the opening beat holds both the"
      - "ship and the camera; this is where both are handed over, in the same"
      - "beat as the objective that says what to do with them."
      - ""
      - "The field opens here, on the first move order, so the lanes are empty"
      - "while Helm is still explaining them and full the moment the player"
      - "starts flying."
      - ""
      - "The rocks fall down the lanes rather than running along them:"
      - "from: top is the screen edge they come IN by, so they enter above the"
      - "view and drift down across it. Everything else about the heading"
      - "follows -- 270, fanned 60 degrees about straight down."
      - ""
      - "region stops at x 3430, which is the gate batteries' own line. Past"
      - "them the player is inside Bolthole's perimeter and under its guns, and"
      - "weather in the lanes has no business falling through someone's front"
      - "yard. The clip is on the SPAWN, not on the rock: one already falling"
      - "keeps falling, so the field thins as the player clears the last beacon"
      - "rather than stopping dead at a line."
      - ""
      - "y is left to the room. With rocks coming from the top the vertical"
      - "pair only decides whether they come at all, and here they always"
      - "should."
    controls: on
    meteors: on
    objective: "Follow the Ratlines# #Reach each dead beacon in sequence"
    gate: 0
    wait: gate

  - autosave: true
    say:
      who: Helm
      sprite: spr_MesMan1
      text: "Beacon One confirmed, Captain. Four to go."
    gate: 1
    wait: gate

  - say:
      who: Helm
      sprite: spr_MesMan1
      text: "Hull stress rising Captain! Recommend we keep to the lane."
    gate: 2
    wait: gate

  - music: battle
    surge: on
    autosave: true
    say:
      who: Helm
      sprite: spr_MesMan1
      text: "Storm surge! The lane behind us just closed. No turning back now."
    gate: 3
    wait: gate

  - say:
      who: Helm
      sprite: spr_MesMan1
      text: "Last stretch Captain. Beacon Five is close."
    gate: 4
    wait: gate

  - say:
      who: Bolthole Approach
      sprite: spr_MesHQ
      color: red
      text: "Unidentified contact, this is Bolthole Approach. You are inside the perimeter. Authenticate immediately or be fired upon."

  - say:
      who: Helm
      sprite: spr_MesMan1
      text: "Transmitting authentication..."

  - meteors: off
    autosave: true
    say:
      who: Bolthole Approach
      sprite: spr_MesHQ
      text: "Authentication confirmed. Guns to standby. Welcome home, Captain."

  - note:
      - "The reveal. The camera is aimed at the yard's measured centre, not at"
      - "the approach: with art, station and berths span world 3709-4822 x"
      - "615-1219, so 1113 x 604, centred on (4265.5, 917)."
      - ""
      - "centreCamera already frames the part of the view the player can see."
      - "Measured at speed 0, view_xview comes out at exactly"
      - "argument - (view_wview[0] - GUI_MinimapSize * l_zoom) / 2, and"
      - "view_yview at argument - view_hview[0] / 2 - so it reads the live view"
      - "and discounts the HUD column itself, and that aim holds at any aspect."
      - ""
      - "x is therefore 4266 plus 31: a pan does not reach its target, it parks"
      - "short of it in the direction it came from, and this pan always comes"
      - "from the left because the player flies in from x 260. Measured at 31.15"
      - "and identical across three runs. y needs no such term - the pan is"
      - "almost pure x. Change the approach and this term changes with it:"
      - "re-read view_xview rather than assuming it holds."
      - ""
      - "What does NOT survive a change of aspect is the fit. mods/aspect.gml"
      - "sets view_wview[0] = round(view_hview[0] * display_w / display_h) with"
      - "the height pinned at 768, so the clear width is 768*aspect - 160: 1205"
      - "at 16:9, 1069 at 16:10, 864 at 4:3. The yard needs 1113, so at 16:10 and"
      - "narrower the outer berths lose their tips wherever this points. 604 tall"
      - "against 768 always fits."
      - ""
      - "Aimed at the approach (3020) the station's core sat under the HUD column"
      - "and two of the four berthed hulls were off-screen entirely."
      - ""
      - "The berths: the station is drawn at facing 90, which maps its design"
      - "(x, y) to world (y, -x) - the arms sit at design y -468/-291/+291/+468"
      - "and reach design x 252, so their tips are world y 850 at x 3669 +/- 468"
      - "and +/- 291. Each hull is nose-in at facing 270 and every y below is set"
      - "so all four bows land on world y 878, i.e. 28 *into* the arm tips. The"
      - "overlap is the point: at a clean tangent they read as four ships parked"
      - "near a station, and only contact reads as moored. Bow reach is measured"
      - "in pixels, not off the section origin (Hecate and Athena 171, Cronus"
      - "103, Hestia 78), because section art runs ~40 past its origin and"
      - "measuring on centres puts every hull 40 short. The inboard pair is"
      - "nudged 11 off the arm centres: Cronus is 210 across the beam and Hecate"
      - "162, needing 186 of separation where the arms give 177. That leaves 13"
      - "clear between them, and each hull still straddles its own arm."
    music: theme
    eerie: off
    interference: {ships: off, clouds: on}
    bounds: off
    camera: {x: 4297, y: 917, speed: 90, zoom: 1.3}
    say:
      who: Fleet HQ
      sprite: spr_MesHQ
      text: "Welcome back Captain. We were worried the storm had taken you."

  - say:
      who: Fleet HQ
      sprite: spr_MesHQ
      text: "Reactor cores, medical supplies and the seed vault... You've bought Bolthole another year, Captain. The colony owes you their lives."

  - say:
      who: Fleet HQ
      sprite: spr_MesHQ
      text: "Captain, stand by. Priority channel from the Admiralty."

  - say:
      who: Fleet Admiral Hong
      sprite: spr_MesHong
      text: "It's been a long time since Sol, old friend. Bring your ship alongside the naval yard. There's something I want you to see."
    gate_at: {x: 4247, y: 825}
    wait: gate

  - spawn:
      - {object: Hestia, x: 4244, y: 701, name: hestiax}
    ping: hestiax
    say:
      who: Fleet Admiral Hong
      sprite: spr_MesHong
      text: "She's been alongside you since the fifth beacon, Captain. Not one of your sensors saw her. We call her the Hestia X."

  - say:
      who: Fleet Admiral Hong
      sprite: spr_MesHong
      text: "Nineteen years ago I promised to keep the Alien device safe. I kept that promise - and my engineers kept busy. The cloak is drawn from Nanz wreckage. The shield is the same flux barrier that guarded Fleet HQ, small enough at last to fit a destroyer."

  - say:
      who: Fleet Admiral Hong
      sprite: spr_MesHong
      text: "Now listen carefully. The Nanz operate a station in the Vega sector - the same base Cherenkov stumbled on nineteen years ago. We never had the strength to go back. Now we have something better than strength. There is something aboard that station that can turn this war around, Captain, and we are going to steal it."

  - say:
      who: Fleet Admiral Hong
      sprite: spr_MesHong
      text: "An extraction team will ride with you. They know what they are looking for. You will not - and you will not ask. A secret is only safe when nobody who can be captured is carrying it."

  - say:
      who: Fleet Admiral Hong
      sprite: spr_MesHong
      text: "You have kept Bolthole's secret for nineteen years, Captain. Forgive me for keeping one from you."

  - objective: "Report aboard the Hestia X"

  - say:
      who: Fleet Admiral Hong
      sprite: spr_MesHong
      text: "Get some rest. You leave in eighteen hours. And Captain - the last free port in human space will be watching you go. Come back."

  - win: true
